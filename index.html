<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aman Web Development - Build your dream website. Website design, e-commerce, mobile-friendly websites, SEO and maintenance.">
  <meta name="theme-color" content="#07164d">
  <title>Aman Web Development</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #06123d;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 34px;
      gap: 22px;
      background: radial-gradient(circle at top, #123b9c 0, #06123d 58%, #02071d 100%);
    }
    .banner-wrap {
      width: min(100%, 1200px);
      border: 2px solid rgba(92, 190, 255, .8);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 45px rgba(0,0,0,.45), 0 0 24px rgba(0,160,255,.25);
      background: #07164d;
    }
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }
    .contact {
      width: min(100%, 900px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .contact a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 210px;
      padding: 14px 20px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 5px 16px rgba(0,0,0,.25);
      transition: transform .18s ease, filter .18s ease;
    }
    .contact a:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .whatsapp { background: #128c45; }
    .instagram { background: linear-gradient(110deg, #833ab4, #fd1d1d, #fcb045); }
    footer { color: #cbd8ff; font-size: 13px; text-align: center; }
    @media (max-width: 560px) {
      .page { padding: 12px 8px 24px; gap: 16px; }
      .banner-wrap { border-radius: 8px; }
      .contact { flex-direction: column; align-items: stretch; }
      .contact a { width: 100%; }
    }
  </style>
</head>
